name: macOS builds

# Builds the macOS desktop installer and VS Code package from the private source repositories.
# This repository is public, so its logs are too: build output goes to files and only the tail
# of a failed step is printed. Nothing but the finished binaries is uploaded.

on:
    workflow_dispatch:
        inputs:
            core_ref:
                description: Commit of the core to build
                default: 8090f45f12e567cabe0c65e808915db0979ef841
            desktop_ref:
                description: Commit of the desktop app and the extension to build
                default: 17d116cbe65bc91420611563a1e1ac35cfb7aa3c
    push:
        branches:
            - 'build/**'

permissions:
    contents: read

env:
    CORE_REF: ${{ inputs.core_ref || '8090f45f12e567cabe0c65e808915db0979ef841' }}
    DESKTOP_REF: ${{ inputs.desktop_ref || '17d116cbe65bc91420611563a1e1ac35cfb7aa3c' }}
    PROTOCOL_VERSION: '0.2.8'

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: macos-latest
                      rust_target: aarch64-apple-darwin
                      vsce_target: darwin-arm64
                    - runner: macos-15-intel
                      rust_target: x86_64-apple-darwin
                      vsce_target: darwin-x64
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Check out the core
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/llm-pbt-agent
                  ref: ${{ env.CORE_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: core
                  persist-credentials: false

            - name: Check out the desktop app
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/llm-pbt-desktop
                  ref: ${{ env.DESKTOP_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: desktop
                  persist-credentials: false

            - uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.rust_target }}

            - name: Build the core
              working-directory: core
              run: |
                  python -m pip install --quiet --upgrade pip
                  python scripts/build-sidecar.py --target-triple "${{ matrix.rust_target }}" \
                    > "$RUNNER_TEMP/core-build.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/core-build.log"; exit 1; }
                  ls dist/specforge

            - name: Check the core answers the handshake
              working-directory: ${{ runner.temp }}
              run: |
                  launcher="$GITHUB_WORKSPACE/core/dist/specforge/python-core-${{ matrix.rust_target }}"
                  hello='{"jsonrpc":"2.0","id":1,"method":"hello","params":{"protocol_version":"'"$PROTOCOL_VERSION"'","client":{"name":"build-check","version":"0"}}}'
                  reply=$(printf '%s\n' "$hello" | SPECFORGE_DATA_DIR="$RUNNER_TEMP/core-data" "$launcher" --serve 2>/dev/null | head -n 1)
                  echo "${reply:0:140}"
                  echo "$reply" | grep -q "\"protocol_version\":\"$PROTOCOL_VERSION\""

            - name: Build the desktop installer
              working-directory: desktop
              run: |
                  npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/npm.log"; exit 1; }
                  mkdir -p src-tauri/binaries
                  cp -R ../core/dist/specforge/. src-tauri/binaries/
                  npx tauri build --target "${{ matrix.rust_target }}" --bundles app,dmg \
                    > "$RUNNER_TEMP/tauri.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/tauri.log"; exit 1; }
                  mkdir -p "$GITHUB_WORKSPACE/out"
                  cp src-tauri/target/"${{ matrix.rust_target }}"/release/bundle/dmg/*.dmg "$GITHUB_WORKSPACE/out/"

            - name: Build the VS Code package
              working-directory: desktop/src-vscode
              run: |
                  npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm-vscode.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/npm-vscode.log"; exit 1; }
                  mkdir -p sidecar
                  cp -R ../../core/dist/specforge/. sidecar/
                  { npm run package:prepare \
                    && npx vsce package --target "${{ matrix.vsce_target }}" --no-dependencies --skip-license; } \
                    > "$RUNNER_TEMP/vsce.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/vsce.log"; exit 1; }
                  cp ./*.vsix "$GITHUB_WORKSPACE/out/"

            - name: List what was built
              run: |
                  ls -la out
                  shasum -a 256 out/*

            - uses: actions/upload-artifact@v4
              with:
                  name: macos-${{ matrix.vsce_target }}
                  path: out/*
                  if-no-files-found: error
                  retention-days: 7
