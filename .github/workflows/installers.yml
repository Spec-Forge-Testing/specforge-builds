name: Installers

# Installs the published CLI the way its README says, on a real machine of each system, and
# checks the installed CLI starts its core.

on:
    workflow_dispatch:
    push:
        branches:
            - 'check/**'

permissions:
    contents: read

env:
    INSTALLERS: https://raw.githubusercontent.com/Spec-Forge-Testing/specforge-releases/master

jobs:
    install:
        strategy:
            fail-fast: false
            matrix:
                runner: [ubuntu-22.04, macos-latest, macos-15-intel, windows-latest]
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Install (Linux and macOS)
              if: runner.os != 'Windows'
              run: |
                  curl -fsSL "$INSTALLERS/install.sh" | sh
                  echo "$HOME/.local/bin" >> "$GITHUB_PATH"

            - name: Install (Windows)
              if: runner.os == 'Windows'
              shell: pwsh
              run: |
                  Invoke-RestMethod "$env:INSTALLERS/install.ps1" | Invoke-Expression
                  Join-Path $env:LOCALAPPDATA "specforge" | Out-File -FilePath $env:GITHUB_PATH -Append

            # `describe` asks the core for its catalog: the installed CLI started the core it carries.
            - name: The installed CLI starts its core
              shell: bash
              run: |
                  specforge describe --json-output > /dev/null
                  echo "specforge is $(command -v specforge)"

