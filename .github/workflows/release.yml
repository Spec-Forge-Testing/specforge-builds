name: Release

# Builds the desktop installers, the VS Code packages and the CLI for Windows, Linux and macOS
# from the private source repositories and, when asked to, publishes them to specforge-releases.
# This repository is public, so its logs are too: build output goes to files and only the tail
# of a failed step is printed. Nothing but the finished binaries is uploaded.

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version to release, as every source given below declares it (e.g. 0.3.0)
                required: true
            core_ref:
                description: Commit of the core (llm-pbt-agent) to build
                required: true
            protocol_version:
                description: Protocol version the built core must answer the handshake with
                required: true
            desktop_ref:
                description: Commit of the desktop app and the extension (llm-pbt-desktop); empty skips both
                required: false
            cli_ref:
                description: Commit of the CLI (specforge-cli); empty skips it
                required: false
            highlights:
                description: What is new, one item per ";" (optional)
                required: false
            publish:
                description: Publish to specforge-releases (off = build only, files stay as artifacts)
                type: boolean
                default: false

run-name: Release ${{ inputs.version }}${{ inputs.publish && '' || ' (build only)' }}

permissions:
    contents: read

env:
    VERSION: ${{ inputs.version }}
    CORE_REF: ${{ inputs.core_ref }}
    DESKTOP_REF: ${{ inputs.desktop_ref }}
    CLI_REF: ${{ inputs.cli_ref }}
    PROTOCOL_VERSION: ${{ inputs.protocol_version }}
    RELEASES_REPO: Spec-Forge-Testing/specforge-releases
    # The same PyInstaller the core's own build pins.
    PYINSTALLER: pyinstaller==6.22.3

defaults:
    run:
        shell: bash

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                include:
                    - runner: windows-latest
                      rust_target: x86_64-pc-windows-msvc
                      vsce_target: win32-x64
                      bundles: nsis,msi
                      cli_platform: windows-x86_64
                    - runner: ubuntu-22.04
                      rust_target: x86_64-unknown-linux-gnu
                      vsce_target: linux-x64
                      bundles: deb
                      cli_platform: linux-x86_64
                    - runner: macos-latest
                      rust_target: aarch64-apple-darwin
                      vsce_target: darwin-arm64
                      bundles: app,dmg
                      cli_platform: macos-arm64
                    - runner: macos-15-intel
                      rust_target: x86_64-apple-darwin
                      vsce_target: darwin-x64
                      bundles: app,dmg
                      cli_platform: macos-x86_64
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Check out this repository
              uses: actions/checkout@v4
              with:
                  path: builds

            - name: Check out the core
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/llm-pbt-agent
                  ref: ${{ env.CORE_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: core
                  persist-credentials: false

            - name: Check out the desktop app
              if: inputs.desktop_ref != ''
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/llm-pbt-desktop
                  ref: ${{ env.DESKTOP_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: desktop
                  persist-credentials: false

            - name: Check out the CLI
              if: inputs.cli_ref != ''
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/specforge-cli
                  ref: ${{ env.CLI_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: cli
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Check the desktop app and the extension declare this version
              if: inputs.desktop_ref != ''
              run: node builds/scripts/check-version.mjs desktop desktop "$VERSION"

            - name: Check the CLI declares this version
              if: inputs.cli_ref != ''
              run: node builds/scripts/check-version.mjs cli cli "$VERSION"

            - name: Install Tauri Linux dependencies
              if: runner.os == 'Linux' && inputs.desktop_ref != ''
              run: |
                  sudo apt-get update -qq
                  sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
                    patchelf build-essential curl wget file libssl-dev libgtk-3-dev > /dev/null

            # The Linux core is built with a Python that links against an old glibc, so it runs on
            # distributions older than the runner.
            - name: Set up Python (Linux)
              if: runner.os == 'Linux'
              run: |
                  curl -LsSf https://astral.sh/uv/install.sh | sh > /dev/null
                  "$HOME/.local/bin/uv" venv --quiet --python 3.11 "$RUNNER_TEMP/venv"
                  "$HOME/.local/bin/uv" pip install --quiet --python "$RUNNER_TEMP/venv/bin/python" pip
                  echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

            - name: Set up Python (Windows and macOS)
              if: runner.os != 'Linux'
              uses: actions/setup-python@v5
              with:
                  python-version: '3.11'

            - uses: dtolnay/rust-toolchain@stable
              if: inputs.desktop_ref != ''
              with:
                  targets: ${{ matrix.rust_target }}

            - name: Build the core
              working-directory: core
              run: |
                  python -m pip install --quiet --upgrade pip
                  python scripts/build-sidecar.py --target-triple "${{ matrix.rust_target }}" \
                    > "$RUNNER_TEMP/core-build.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/core-build.log"; exit 1; }
                  ls dist/specforge

            # PyInstaller copies the runner's C++ runtime in; the target's own is used instead, so
            # the core does not ask for the runner's glibc.
            - name: Keep the Linux core portable
              if: runner.os == 'Linux'
              run: |
                  rm -f core/dist/specforge/_internal/libstdc++.so.6 core/dist/specforge/_internal/libgcc_s.so.1
                  bash builds/scripts/check-glibc-floor.sh core/dist/specforge 2.28

            - name: Check the core answers the handshake
              working-directory: ${{ runner.temp }}
              run: bash "$GITHUB_WORKSPACE/builds/scripts/check-handshake.sh" "$GITHUB_WORKSPACE/core/dist/specforge" "$PROTOCOL_VERSION"

            - name: Build the desktop installer
              if: inputs.desktop_ref != ''
              working-directory: desktop
              run: |
                  npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/npm.log"; exit 1; }
                  mkdir -p src-tauri/binaries
                  cp -R ../core/dist/specforge/. src-tauri/binaries/
                  npx tauri build --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}" \
                    > "$RUNNER_TEMP/tauri.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/tauri.log"; exit 1; }
                  mkdir -p "$GITHUB_WORKSPACE/out"
                  find "src-tauri/target/${{ matrix.rust_target }}/release/bundle" -maxdepth 2 -type f \
                    \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.dmg' \) \
                    -exec cp {} "$GITHUB_WORKSPACE/out/" \;

            - name: Build the VS Code package
              if: inputs.desktop_ref != ''
              working-directory: desktop/src-vscode
              run: |
                  npm ci --no-audit --no-fund > "$RUNNER_TEMP/npm-vscode.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/npm-vscode.log"; exit 1; }
                  # A macOS core holds symbolic links, which vsce cannot package: the copy
                  # resolves them, and the handshake proves the resolved copy still runs.
                  echo "symbolic links in the core: $(find ../../core/dist/specforge -type l | wc -l)"
                  mkdir -p sidecar
                  cp -RL ../../core/dist/specforge/. sidecar/
                  sidecar="$PWD/sidecar"
                  (cd "$RUNNER_TEMP" && bash "$GITHUB_WORKSPACE/builds/scripts/check-handshake.sh" "$sidecar" "$PROTOCOL_VERSION")
                  { npm run package:prepare \
                    && npx vsce package --target "${{ matrix.vsce_target }}" --no-dependencies --skip-license; } \
                    > "$RUNNER_TEMP/vsce.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/vsce.log"; exit 1; }
                  mkdir -p "$GITHUB_WORKSPACE/out"
                  cp ./*.vsix "$GITHUB_WORKSPACE/out/"

            # Built in an environment of its own, as the CLI's release does: the core's packages
            # stay out of it. The core built above goes in core/, beside the CLI.
            - name: Build the CLI
              if: inputs.cli_ref != ''
              working-directory: cli
              run: |
                  python -m venv "$RUNNER_TEMP/cli-venv"
                  cli_python="$RUNNER_TEMP/cli-venv/bin/python"
                  [ -x "$cli_python" ] || cli_python="$RUNNER_TEMP/cli-venv/Scripts/python.exe"
                  ( "$cli_python" -m pip install --quiet "$PYINSTALLER" . \
                    && cd packaging \
                    && "$cli_python" -m PyInstaller --noconfirm --clean --distpath dist --workpath build specforge.spec ) \
                    > "$RUNNER_TEMP/cli-build.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/cli-build.log"; exit 1; }
                  mkdir -p packaging/dist/specforge/core
                  cp -R ../core/dist/specforge/. packaging/dist/specforge/core/
                  ls packaging/dist/specforge

            - name: Archive the CLI (Linux and macOS)
              if: inputs.cli_ref != '' && runner.os != 'Windows'
              working-directory: cli/packaging/dist
              run: tar -cJf "specforge-v$VERSION-${{ matrix.cli_platform }}.tar.xz" specforge

            - name: Archive the CLI (Windows)
              if: inputs.cli_ref != '' && runner.os == 'Windows'
              working-directory: cli/packaging/dist
              shell: pwsh
              run: Compress-Archive -Path specforge -DestinationPath "specforge-v$env:VERSION-${{ matrix.cli_platform }}.zip"

            # What someone downloads is the archive, so that is what gets tried: unpacked
            # somewhere else, the CLI has to start the core it carries.
            - name: Check the archived CLI starts its core
              if: inputs.cli_ref != ''
              run: bash builds/scripts/check-cli-archive.sh cli/packaging/dist "$RUNNER_TEMP/cli-unpacked"

            - name: Collect the CLI archive
              if: inputs.cli_ref != ''
              run: |
                  mkdir -p out
                  cp cli/packaging/dist/specforge-v* out/

            - name: List what was built
              run: ls -la out

            - uses: actions/upload-artifact@v4
              with:
                  name: build-${{ matrix.vsce_target }}
                  path: out/*
                  if-no-files-found: error
                  retention-days: 7

    # The image `specforge ci init` writes into a pipeline: tagged with the CLI's version and built
    # from the same core commit its binaries carry. Always built and tried; pushed only on publish.
    image:
        if: inputs.cli_ref != ''
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            packages: write
        env:
            IMAGE: ghcr.io/spec-forge-testing/specforge
        steps:
            - name: Check out this repository
              uses: actions/checkout@v4
              with:
                  path: builds

            - name: Check out the CLI
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/specforge-cli
                  ref: ${{ env.CLI_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: cli
                  persist-credentials: false

            - name: Check out the core
              uses: actions/checkout@v4
              with:
                  repository: Spec-Forge-Testing/llm-pbt-agent
                  ref: ${{ env.CORE_REF }}
                  token: ${{ secrets.SOURCE_READ_TOKEN }}
                  path: core-source
                  persist-credentials: false

            - name: Check the CLI declares this version
              run: node builds/scripts/check-version.mjs cli cli "$VERSION"

            - uses: docker/setup-buildx-action@v3

            - name: Build the image
              run: |
                  docker buildx build --load \
                    -f cli/packaging/docker/Dockerfile \
                    --build-context core=core-source \
                    --label "org.opencontainers.image.version=$VERSION" \
                    --label "dev.specforge.core=$CORE_REF" \
                    -t "$IMAGE:$VERSION" cli \
                    > "$RUNNER_TEMP/image-build.log" 2>&1 \
                    || { tail -n 40 "$RUNNER_TEMP/image-build.log"; exit 1; }
                  docker image inspect "$IMAGE:$VERSION" --format 'built: {{.Size}} bytes'

            # The image starts and knows `ci`, which the general help does not list.
            - name: Check the image starts
              run: docker run --rm "$IMAGE:$VERSION" ci --help > /dev/null

            - name: Log in to the registry
              if: inputs.publish
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Refuse to replace a published image
              if: inputs.publish
              run: |
                  if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
                    echo "::error::$IMAGE:$VERSION is already published"
                    exit 1
                  fi

            - name: Push the image
              if: inputs.publish
              run: docker push --quiet "$IMAGE:$VERSION"

    publish:
        needs: [build, image]
        # The image job is skipped when no CLI is released, and that must not skip this one.
        if: ${{ !cancelled() && inputs.publish && needs.build.result == 'success' && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
        runs-on: ubuntu-22.04
        env:
            GH_TOKEN: ${{ secrets.RELEASES_WRITE_TOKEN }}
            HIGHLIGHTS: ${{ inputs.highlights }}
        steps:
            - uses: actions/checkout@v4

            - uses: actions/download-artifact@v4
              with:
                  path: files
                  merge-multiple: true

            - name: Refuse to overwrite a published version
              run: |
                  tags=""
                  [ -z "$DESKTOP_REF" ] || tags="v$VERSION vscode-v$VERSION"
                  [ -z "$CLI_REF" ] || tags="$tags cli-v$VERSION"
                  for tag in $tags; do
                    if gh release view "$tag" --repo "$RELEASES_REPO" > /dev/null 2>&1; then
                      echo "::error::$tag is already published in $RELEASES_REPO"
                      exit 1
                    fi
                  done

            - name: Publish the VS Code packages
              if: inputs.desktop_ref != ''
              run: |
                  python3 scripts/render-notes.py notes/vscode.md "$VERSION" "$HIGHLIGHTS" > vscode-notes.md
                  gh release create "vscode-v$VERSION" files/*.vsix --repo "$RELEASES_REPO" \
                    --title "Spec Forge for VS Code v$VERSION" --notes-file vscode-notes.md --latest=false

            # `specforge update` refuses an archive whose hash does not match SHA256SUMS, and
            # install.sh, install.ps1 and `specforge update` only look at cli-v* releases.
            - name: Publish the CLI
              if: inputs.cli_ref != ''
              run: |
                  python3 scripts/render-notes.py notes/cli.md "$VERSION" "$HIGHLIGHTS" > cli-notes.md
                  mkdir cli-files
                  mv files/specforge-v* cli-files/
                  (cd cli-files && sha256sum -- * > SHA256SUMS)
                  gh release create "cli-v$VERSION" cli-files/* --repo "$RELEASES_REPO" \
                    --title "Spec Forge CLI v$VERSION" --notes-file cli-notes.md --latest=false

            - name: Publish the desktop installers
              if: inputs.desktop_ref != ''
              run: |
                  python3 scripts/render-notes.py notes/desktop.md "$VERSION" "$HIGHLIGHTS" > desktop-notes.md
                  shopt -s nullglob
                  gh release create "v$VERSION" files/*.exe files/*.msi files/*.deb files/*.dmg \
                    --repo "$RELEASES_REPO" \
                    --title "Spec Forge Desktop v$VERSION" --notes-file desktop-notes.md --latest

            - name: Propose the README with the new version
              run: |
                  gh repo clone "$RELEASES_REPO" releases -- --quiet
                  cd releases
                  components=""
                  [ -z "$DESKTOP_REF" ] || components="desktop"
                  [ -z "$CLI_REF" ] || components="$components cli"
                  python3 ../scripts/bump-readme.py README.md "$VERSION" $components
                  if git diff --quiet; then echo "README already names $VERSION"; exit 0; fi
                  branch="docs/readme-$VERSION"
                  git config user.name "specforge-builds"
                  git config user.email "specforge-builds@users.noreply.github.com"
                  git checkout --quiet -b "$branch"
                  git commit --quiet -am "docs(readme): point the downloads at $VERSION"
                  git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${RELEASES_REPO}.git"
                  git push --quiet origin "$branch"
                  gh pr create --repo "$RELEASES_REPO" --head "$branch" \
                    --title "docs(readme): point the downloads at $VERSION" \
                    --body "Version $VERSION is published. This points the README's download links at it."
